[pytest]
# Single test-suite configuration for the keyword research pipeline.
# Run the whole suite with:  py -m pytest
# (or a single file:         py -m pytest tests/test_filters.py -v)
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
# Coverage runs on every local execution (--cov). The floor (--cov-fail-under)
# is applied only in CI, so single-file runs stay usable day to day.
# Exclusion config (tests/, conftest) lives in .coveragerc.
addopts = -ra -q --cov=. --cov-report=term-missing
